name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run test suite
        run: pytest -q

      - name: Run real Redis integration tests
        run: pytest -q -m redis

      - name: Run bounded Redis rotation and AOF integration test
        run: pytest -q -m live_redis_rotation

      - name: Run live Redis ACL enforcement matrix
        run: pytest -q -m live_redis_acl

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate container image packaging
        run: |
          docker build -f services/orchestrator/Dockerfile -t test-orchestrator .
          docker run --rm --entrypoint python test-orchestrator -c "import orchestrator.presentation.api"
          docker build -f services/worker/Dockerfile -t test-worker .
          docker run --rm --entrypoint python test-worker -c "import agent_policy, worker.main"
          docker build -f services/research_agent/Dockerfile -t test-research-agent .
          docker run --rm --entrypoint python test-research-agent -c "import agent_policy, research_agent.main"
          docker build -f services/analysis_agent/Dockerfile -t test-analysis-agent .
          docker run --rm --entrypoint python test-analysis-agent -c "import analysis_agent.main"
