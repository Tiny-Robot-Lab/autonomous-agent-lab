[project]
name = "autonomous-agent-lab"
version = "0.5.0"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"

[tool.pytest.ini_options]
pythonpath = [
    "services/orchestrator/src",
    "services/worker/src",
    "services/research_agent/src",
    "services/analysis_agent/src",
    "packages/contracts/src",
    "packages/infrastructure/src",
    "packages/policy/src",
]
testpaths = ["tests"]
addopts = "-m 'not redis and not live_redis_acl and not live_redis_rotation'"
strict_markers = true
markers = [
    "redis: integration tests requiring an explicit live Redis instance via REDIS_URL",
    "live_redis_acl: live Docker-backed Redis 7.4.12 ACL allow/deny enforcement matrix",
    "live_redis_rotation: bounded Docker Compose Redis credential-rotation and AOF integration test",
    "external_provider: opt-in live tests targeting external network or live providers",
    "run_002_real_model: opt-in offline integration test requiring external Run 002 model artifact and SetFit worker environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyrefly]
search-path = [
    "services/orchestrator/src",
    "services/worker/src",
    "services/research_agent/src",
    "services/analysis_agent/src",
    "packages/contracts/src",
    "packages/infrastructure/src",
    "packages/policy/src",
]
